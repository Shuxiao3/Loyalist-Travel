# Copies each program's logo from Webflow into the repository and points
# the program at the copy, so the site serves logos itself.
#
# Manual: Actions tab → "Fetch program logos" → Run workflow.
name: Fetch program logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download
        run: npm run import:webflow -- logos-local
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/images/programs data/images.json
          git commit -m "Program logos" || echo "nothing to commit"
          # main may have moved while this ran: bring it in, then push, a few tries
          for i in 1 2 3 4; do git pull --rebase origin main && git push && break; sleep 10; done
      - name: Point the programs at them
        run: npm run import:webflow -- images
