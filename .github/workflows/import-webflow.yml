# Runs the Webflow import against the production database.
#
# Manual only: Actions tab → "Import Webflow content" → Run workflow.
# Needs three repository secrets, copied from the Vercel project's environment
# variables: DATABASE_URL and PAYLOAD_SECRET. BLOB_READ_WRITE_TOKEN is
# optional: article photos shipped under public/images/articles are served
# from the site's own files and need no storage; only photos fetched from
# other sites are skipped without it. The import is idempotent, so running
# it again is safe.
name: Import Webflow content

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'One step only (regions, programs, status-levels, brands, amenities, destinations, rubric-versions, hotels, reviews, publish, logos, logos-local, images, hilton, seed-stays, unseed-stays, seed-articles, unseed-articles, articles, articles-force, articles-refresh, articles-report, articles-diff, media-report, retire-tiers, lounge-flags, lounge-brand-rules, seed-lounges, sourced-reports, seed-milestones, seed-cards, seed-brand-ranks). Blank runs the import without publish.'
        required: false
        default: ''

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run migrate
      - name: Import
        run: npm run import:webflow -- ${{ github.event.inputs.step }}
      - name: Spot-check
        run: npm run import:check -- 20
